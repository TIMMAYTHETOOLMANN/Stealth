name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser

      - name: Warm MCP server and HTTP bridge caches
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm install -g supergateway

          WARMUP_TIMEOUT=30
          HEALTH_RETRIES=10

          # Warmup avoids long first-run dependency install delays in sessions.
          set +e
          timeout "${WARMUP_TIMEOUT}s" uvx mcp-stealth-chrome@latest </dev/null > /tmp/mcp-warmup.log 2>&1
          WARMUP_EXIT=$?
          set -e
          if [ "$WARMUP_EXIT" -ne 0 ] && [ "$WARMUP_EXIT" -ne 124 ]; then
            echo "mcp-stealth-chrome warmup failed with exit code $WARMUP_EXIT"
            cat /tmp/mcp-warmup.log || true
            exit "$WARMUP_EXIT"
          fi

          supergateway \
            --stdio "uvx mcp-stealth-chrome@latest" \
            --outputTransport streamableHttp \
            --port 8000 \
            --streamableHttpPath /mcp \
            --healthEndpoint /healthz \
            > /tmp/supergateway.log 2>&1 &

          READY=0
          for i in $(seq 1 "${HEALTH_RETRIES}"); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "supergateway health check failed after ${HEALTH_RETRIES} attempts"
            cat /tmp/supergateway.log || true
            exit 1
          fi
